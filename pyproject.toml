[project]
name = "order-service"
version = "0.1.0"
description = "Training order management service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1.0",
    "httpx>=0.28.1,<1.0",
    "sqlalchemy>=2.1.6,<3.0",
    "uvicorn[standard]>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--durations=0"
